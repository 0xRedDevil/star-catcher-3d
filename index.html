<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Catcher 3D 🧚✨</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #130726;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
            overflow: hidden;
            color: #fff;
        }
        #game {
            position: fixed;
            inset: 0;
        }
        #game canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .ui-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(19, 7, 38, 0.6);
            backdrop-filter: blur(3px);
            z-index: 10;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 2.6rem;
            margin: 0 0 10px 0;
            color: #ffccff;
            text-shadow: 0 0 15px #ff77ff, 0 0 30px #ff00ff;
        }
        p {
            font-size: 1.1rem;
            margin: 5px 0 16px 0;
            color: #d1c4e9;
            max-width: 420px;
        }
        .how-to {
            font-size: 0.95rem;
            color: #ffd9ff;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 8px 16px;
        }
        .btn {
            background: linear-gradient(to bottom, #ff77ff, #aa00aa);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 0, 255, 0.4);
            transition: transform 0.1s;
            font-family: inherit;
            margin: 10px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .leaderboard-box {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 119, 255, 0.3);
            border-radius: 12px;
            padding: 15px;
            width: 85%;
            max-width: 320px;
            margin-bottom: 16px;
        }
        .leaderboard-box h3 {
            margin: 0 0 10px 0;
            color: #ffd700;
            font-size: 1.2rem;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }
        .lb-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }
        .lb-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
            font-size: 1rem;
        }
        .lb-item:last-child {
            border-bottom: none;
        }
        .lb-rank {
            font-weight: bold;
            color: #ff99ff;
            width: 30px;
        }
        .lb-name {
            flex-grow: 1;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 10px;
        }
        .lb-score {
            font-weight: bold;
            color: #00ffff;
        }
        .input-group {
            margin: 10px 0;
        }
        input[type="text"] {
            padding: 12px 18px;
            font-size: 1.2rem;
            border-radius: 25px;
            border: 2px solid #ff77ff;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            text-align: center;
            width: 80%;
            max-width: 260px;
            outline: none;
            font-family: inherit;
            user-select: text;
            -webkit-user-select: text;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            pointer-events: none;
            font-size: 1.4rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .hud-pill {
            background: rgba(50, 20, 80, 0.6);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 119, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #error {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div id="game">
        <!-- HUD during gameplay -->
        <div id="hud" class="hidden">
            <div class="hud-pill">✨ <span id="score-display">0</span></div>
            <div class="hud-pill"><span id="lives-display">❤️❤️❤️</span></div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="ui-screen">
            <h1>Star Catcher 3D</h1>
            <p>Fly the fairy along the starry sky path! Catch stars and hearts, and dodge the stormy clouds.</p>
            <p class="how-to">⬅️ ➡️ arrow keys, move the mouse, or drag your finger</p>

            <div class="leaderboard-box">
                <h3>🏆 Top 5 Stars</h3>
                <ul id="start-lb" class="lb-list"></ul>
            </div>

            <button class="btn" id="start-btn">Fly! ✨</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="ui-screen hidden">
            <h1>Game Over!</h1>
            <p>You collected <span id="final-score" style="color: #ffd700; font-weight: bold;">0</span> stars!</p>

            <div id="new-high-score-section" class="input-group hidden">
                <p style="color: #00ffff; margin-bottom: 8px;">🎉 New Top 5 Score! Enter Your Name:</p>
                <input type="text" id="player-name" maxlength="12" placeholder="Your Name">
                <br>
                <button class="btn" id="save-score-btn" style="padding: 10px 24px; font-size: 1.1rem; margin-top: 10px;">Save Score</button>
            </div>

            <div class="leaderboard-box">
                <h3>🏆 Leaderboard</h3>
                <ul id="gameover-lb" class="lb-list"></ul>
            </div>

            <button class="btn" id="restart-btn">Fly Again 🌟</button>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // Tuning
        const PATH_HALF = 4;        // half the width of the glowing path
        const LIMIT_X = 3.4;        // how far left/right the fairy can steer
        const FAIRY_Y = 1.2;        // fairy flying height
        const SPAWN_Z = -90;        // where new items appear
        const DESPAWN_Z = 12;       // items behind the camera get removed
        const BASE_SPEED = 12;
        const MAX_SPEED = 26;
        const SPEED_GROWTH = 0.2;   // speed gained per second of play
        const STEER_SPEED = 9;      // keyboard steering, units per second
        const MAX_LIVES = 5;

        const container = document.getElementById('game');

        let renderer;
        try {
            renderer = new THREE.WebGLRenderer({ antialias: true });
        } catch (e) {
            container.innerHTML = '<div id="error"><p>Sorry, this game needs 3D graphics (WebGL), which this browser does not support.</p></div>';
            throw e;
        }
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.prepend(renderer.domElement);
        const canvas = renderer.domElement;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x130726);
        scene.fog = new THREE.Fog(0x130726, 35, 95);

        const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 400);
        let camY = 3.6;
        let camZ = 7;

        function resize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            // Portrait screens (phones, tablets) see less of the path, so pull the camera back
            const portrait = w < h;
            camera.fov = portrait ? 72 : 60;
            camY = portrait ? 4.6 : 3.6;
            camZ = portrait ? 9.5 : 7;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resize);
        resize();

        // Lights
        scene.add(new THREE.HemisphereLight(0xffd6ff, 0x2a1050, 1.6));
        const moonLight = new THREE.DirectionalLight(0xffffff, 1.4);
        moonLight.position.set(-4, 10, 6);
        scene.add(moonLight);

        // Shared textures
        function makeGlowTexture() {
            const c = document.createElement('canvas');
            c.width = c.height = 64;
            const g = c.getContext('2d');
            const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.35, 'rgba(255,255,255,0.45)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            g.fillStyle = grad;
            g.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(c);
        }
        const glowTex = makeGlowTexture();

        function makeGlow(color, size, opacity = 0.6) {
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: glowTex, color, transparent: true, opacity,
                blending: THREE.AdditiveBlending, depthWrite: false
            }));
            sprite.scale.setScalar(size);
            return sprite;
        }

        function makePathTexture() {
            const c = document.createElement('canvas');
            c.width = c.height = 256;
            const g = c.getContext('2d');
            const grad = g.createLinearGradient(0, 0, 256, 0);
            grad.addColorStop(0, '#ff77ff');
            grad.addColorStop(0.06, '#7a2a9e');
            grad.addColorStop(0.5, '#3b1458');
            grad.addColorStop(0.94, '#7a2a9e');
            grad.addColorStop(1, '#ff77ff');
            g.fillStyle = grad;
            g.fillRect(0, 0, 256, 256);
            // Dashed centre line
            g.fillStyle = 'rgba(255, 220, 255, 0.55)';
            g.fillRect(122, 0, 12, 110);
            // Sparkles
            g.fillStyle = 'rgba(255, 255, 255, 0.8)';
            [[50, 40], [190, 90], [80, 170], [210, 210], [150, 150], [30, 230]].forEach(([x, y]) => {
                g.fillRect(x, y, 4, 4);
            });
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // Glowing sky path
        const PATH_LENGTH = 130;
        const TILE_LENGTH = 10;
        const pathTex = makePathTexture();
        pathTex.repeat.set(1, PATH_LENGTH / TILE_LENGTH);
        const path = new THREE.Mesh(
            new THREE.PlaneGeometry(PATH_HALF * 2, PATH_LENGTH),
            new THREE.MeshBasicMaterial({ map: pathTex, transparent: true, opacity: 0.92 })
        );
        path.rotation.x = -Math.PI / 2;
        path.position.z = 10 - PATH_LENGTH / 2;
        scene.add(path);

        // Glowing orbs along the edges of the path, they rush past to show speed
        const ORB_SPACING = 6;
        const ORB_COUNT = Math.ceil(PATH_LENGTH / ORB_SPACING);
        const orbs = [];
        const orbGeo = new THREE.SphereGeometry(0.16, 12, 10);
        const orbMat = new THREE.MeshBasicMaterial({ color: 0xffccff });
        for (let i = 0; i < ORB_COUNT; i++) {
            for (const side of [-1, 1]) {
                const orb = new THREE.Group();
                orb.add(new THREE.Mesh(orbGeo, orbMat));
                orb.add(makeGlow(0xff77ff, 1.4, 0.7));
                orb.position.set(side * (PATH_HALF + 0.25), 0.25, 10 - i * ORB_SPACING);
                scene.add(orb);
                orbs.push(orb);
            }
        }

        // Faraway starfield and moon (not fogged so they always shine)
        function makeStarfield(count, radius) {
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 1.6 - 0.6); // mostly above the horizon
                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.cos(phi) - 20;
                positions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            return new THREE.Points(geo, new THREE.PointsMaterial({
                color: 0xffffff, size: 1.6, map: glowTex, transparent: true,
                depthWrite: false, fog: false
            }));
        }
        scene.add(makeStarfield(1400, 250));

        const moon = new THREE.Mesh(
            new THREE.SphereGeometry(9, 32, 24),
            new THREE.MeshBasicMaterial({ color: 0xfff3c4, fog: false })
        );
        moon.position.set(-60, 55, -230);
        scene.add(moon);
        const moonGlow = makeGlow(0xffe9a8, 50, 0.5);
        moonGlow.material.fog = false;
        moonGlow.position.copy(moon.position);
        scene.add(moonGlow);

        // Sparkles drifting past close by
        const SPARKLE_COUNT = 350;
        const sparklePos = new Float32Array(SPARKLE_COUNT * 3);
        for (let i = 0; i < SPARKLE_COUNT; i++) {
            let x = (Math.random() - 0.5) * 50;
            if (Math.abs(x) < PATH_HALF + 1) x += Math.sign(x || 1) * (PATH_HALF + 1);
            sparklePos[i * 3] = x;
            sparklePos[i * 3 + 1] = Math.random() * 18 - 4;
            sparklePos[i * 3 + 2] = 10 - Math.random() * PATH_LENGTH;
        }
        const sparkleGeo = new THREE.BufferGeometry();
        sparkleGeo.setAttribute('position', new THREE.BufferAttribute(sparklePos, 3));
        const sparkles = new THREE.Points(sparkleGeo, new THREE.PointsMaterial({
            color: 0xffd9ff, size: 0.35, map: glowTex, transparent: true,
            depthWrite: false, blending: THREE.AdditiveBlending
        }));
        scene.add(sparkles);

        // Shapes
        function starShape(outer, inner, points = 5) {
            const s = new THREE.Shape();
            for (let i = 0; i < points * 2; i++) {
                const r = i % 2 === 0 ? outer : inner;
                const a = Math.PI / 2 + (i * Math.PI) / points;
                const x = Math.cos(a) * r;
                const y = Math.sin(a) * r;
                if (i === 0) s.moveTo(x, y);
                else s.lineTo(x, y);
            }
            s.closePath();
            return s;
        }

        function heartShape() {
            const s = new THREE.Shape();
            s.moveTo(5, 5);
            s.bezierCurveTo(5, 5, 4, 0, 0, 0);
            s.bezierCurveTo(-6, 0, -6, 7, -6, 7);
            s.bezierCurveTo(-6, 11, -3, 15.4, 5, 19);
            s.bezierCurveTo(12, 15.4, 16, 11, 16, 7);
            s.bezierCurveTo(16, 7, 16, 0, 10, 0);
            s.bezierCurveTo(7, 0, 5, 5, 5, 5);
            return s;
        }

        function boltShape() {
            const s = new THREE.Shape();
            s.moveTo(0.05, 0.3);
            s.lineTo(-0.15, -0.02);
            s.lineTo(0.0, -0.02);
            s.lineTo(-0.1, -0.35);
            s.lineTo(0.15, 0.06);
            s.lineTo(0.0, 0.06);
            s.closePath();
            return s;
        }

        const starGeo = new THREE.ExtrudeGeometry(starShape(0.5, 0.22), {
            depth: 0.14, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.04, bevelSegments: 2
        });
        starGeo.center();
        const starMat = new THREE.MeshStandardMaterial({
            color: 0xffd700, emissive: 0xffaa00, emissiveIntensity: 0.6, metalness: 0.3, roughness: 0.35
        });

        const heartGeo = new THREE.ExtrudeGeometry(heartShape(), {
            depth: 4, bevelEnabled: true, bevelThickness: 1, bevelSize: 1, bevelSegments: 3
        });
        heartGeo.center();
        heartGeo.rotateZ(Math.PI); // the shape is drawn upside down
        heartGeo.scale(0.045, 0.045, 0.045);
        const heartMat = new THREE.MeshStandardMaterial({
            color: 0xff3366, emissive: 0xaa1144, emissiveIntensity: 0.6, roughness: 0.4
        });

        const puffGeo = new THREE.SphereGeometry(1, 16, 12);
        const cloudMat = new THREE.MeshStandardMaterial({
            color: 0x6a6f8f, emissive: 0x221133, roughness: 0.9
        });
        const boltGeo = new THREE.ShapeGeometry(boltShape());
        const boltMat = new THREE.MeshBasicMaterial({ color: 0xffee55, side: THREE.DoubleSide });

        // The fairy
        const fairy = new THREE.Group();
        const wings = [];
        {
            const dress = new THREE.Mesh(
                new THREE.ConeGeometry(0.42, 0.9, 20),
                new THREE.MeshStandardMaterial({ color: 0xff77ff, emissive: 0x661166, roughness: 0.5 })
            );
            fairy.add(dress);

            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.26, 20, 16),
                new THREE.MeshStandardMaterial({ color: 0xffdfcc, roughness: 0.7 })
            );
            head.position.y = 0.62;
            fairy.add(head);

            // We see her from behind, so her hair covers most of her head
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x9933ff, roughness: 0.6 });
            const hair = new THREE.Mesh(new THREE.SphereGeometry(0.29, 20, 16), hairMat);
            hair.position.set(0, 0.68, 0.06);
            hair.scale.set(1, 0.95, 0.9);
            fairy.add(hair);
            const ponytail = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 10), hairMat);
            ponytail.position.set(0, 0.52, 0.3);
            fairy.add(ponytail);

            const wingGeo = new THREE.CircleGeometry(0.5, 24);
            wingGeo.scale(1, 0.6, 1);
            wingGeo.translate(0.5, 0.1, 0);
            const wingMat = new THREE.MeshStandardMaterial({
                color: 0xc8f0ff, emissive: 0x6688aa, transparent: true, opacity: 0.7,
                side: THREE.DoubleSide, depthWrite: false
            });
            for (const side of [-1, 1]) {
                const pivot = new THREE.Group();
                pivot.position.set(0.05 * side, 0.3, 0.15);
                const wing = new THREE.Mesh(wingGeo, wingMat);
                wing.scale.x = side;
                wing.rotation.z = 0.35 * side;
                pivot.add(wing);
                pivot.userData.side = side;
                fairy.add(pivot);
                wings.push(pivot);
            }

            const wand = new THREE.Mesh(
                new THREE.CylinderGeometry(0.025, 0.025, 0.6, 8),
                new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.5, roughness: 0.3 })
            );
            wand.position.set(0.4, 0.2, 0);
            wand.rotation.z = -0.6;
            fairy.add(wand);
            const wandStar = new THREE.Mesh(starGeo, starMat);
            wandStar.scale.setScalar(0.35);
            wandStar.position.set(0.57, 0.45, 0);
            fairy.add(wandStar);
            const wandGlow = makeGlow(0xffff88, 0.8, 0.8);
            wandGlow.position.copy(wandStar.position);
            fairy.add(wandGlow);

            const aura = makeGlow(0xff88ff, 2.6, 0.45);
            aura.position.y = 0.3;
            fairy.add(aura);

            const fairyLight = new THREE.PointLight(0xff99ff, 6, 6, 1);
            fairyLight.position.y = 0.6;
            fairy.add(fairyLight);
        }
        fairy.position.set(0, FAIRY_Y, 0);
        scene.add(fairy);

        // Falling items
        let items = [];

        function makeItemMesh(type) {
            if (type === 'star') {
                const g = new THREE.Group();
                g.add(new THREE.Mesh(starGeo, starMat));
                g.add(makeGlow(0xffd700, 1.8, 0.5));
                return g;
            }
            if (type === 'heart') {
                const g = new THREE.Group();
                g.add(new THREE.Mesh(heartGeo, heartMat));
                g.add(makeGlow(0xff5599, 2, 0.55));
                return g;
            }
            const g = new THREE.Group();
            const puffs = [[0, 0, 0, 0.55], [-0.5, -0.1, 0, 0.42], [0.5, -0.1, 0, 0.42], [-0.25, 0.25, -0.05, 0.4], [0.28, 0.22, 0, 0.38]];
            for (const [x, y, z, r] of puffs) {
                const puff = new THREE.Mesh(puffGeo, cloudMat);
                puff.position.set(x, y, z);
                puff.scale.setScalar(r);
                g.add(puff);
            }
            const bolt = new THREE.Mesh(boltGeo, boltMat);
            bolt.position.set(0, -0.6, 0.2);
            bolt.scale.setScalar(1.3);
            g.add(bolt);
            return g;
        }

        const HIT_RADIUS = { star: 0.8, heart: 0.8, cloud: 0.95 };

        function spawnItem(type, x, z) {
            const mesh = makeItemMesh(type);
            mesh.position.set(x, type === 'cloud' ? FAIRY_Y + 0.25 : FAIRY_Y, z);
            mesh.rotation.y = Math.random() * Math.PI;
            scene.add(mesh);
            items.push({ type, mesh, hit: false, phase: Math.random() * Math.PI * 2 });
        }

        function clearItems() {
            items.forEach(it => scene.remove(it.mesh));
            items = [];
        }

        // Sparkle bursts when something is caught
        let bursts = [];
        function burst(pos, color) {
            const n = 18;
            const positions = new Float32Array(n * 3);
            const velocities = [];
            for (let i = 0; i < n; i++) {
                positions[i * 3] = pos.x;
                positions[i * 3 + 1] = pos.y;
                positions[i * 3 + 2] = pos.z;
                velocities.push(new THREE.Vector3((Math.random() - 0.5) * 6, Math.random() * 4, (Math.random() - 0.5) * 6));
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({
                color, size: 0.35, map: glowTex, transparent: true,
                depthWrite: false, blending: THREE.AdditiveBlending
            });
            const points = new THREE.Points(geo, mat);
            scene.add(points);
            bursts.push({ points, velocities, life: 0.7 });
        }

        function updateBursts(dt, move) {
            for (let i = bursts.length - 1; i >= 0; i--) {
                const b = bursts[i];
                b.life -= dt;
                const attr = b.points.geometry.attributes.position;
                for (let j = 0; j < b.velocities.length; j++) {
                    const v = b.velocities[j];
                    attr.array[j * 3] += v.x * dt;
                    attr.array[j * 3 + 1] += v.y * dt;
                    attr.array[j * 3 + 2] += v.z * dt + move;
                }
                attr.needsUpdate = true;
                b.points.material.opacity = Math.max(0, b.life / 0.7);
                if (b.life <= 0) {
                    scene.remove(b.points);
                    b.points.geometry.dispose();
                    b.points.material.dispose();
                    bursts.splice(i, 1);
                }
            }
        }

        // Audio setup (Web Audio API for zero external file dependencies)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'star') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'heart') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.08);
                    osc.frequency.setValueAtTime(659.25, now + 0.16);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'hurt') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(60, now + 0.25);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            } catch (e) {
                // Ignore audio context autoplay blocks before interaction
            }
        }

        // Leaderboard Management
        const LB_KEY = 'star_catcher_3d_leaderboard';

        function getLeaderboard() {
            try {
                const data = localStorage.getItem(LB_KEY);
                if (data) return JSON.parse(data);
            } catch (e) {}
            return [];
        }

        function saveLeaderboard(lb) {
            try {
                localStorage.setItem(LB_KEY, JSON.stringify(lb));
            } catch (e) {}
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function renderLeaderboard(elementId) {
            const listEl = document.getElementById(elementId);
            const lb = getLeaderboard();
            listEl.innerHTML = '';
            if (lb.length === 0) {
                const li = document.createElement('li');
                li.className = 'lb-item';
                li.innerHTML = '<span class="lb-name" style="text-align: center;">No scores yet. Be the first! ⭐</span>';
                listEl.appendChild(li);
                return;
            }
            lb.forEach((entry, index) => {
                const li = document.createElement('li');
                li.className = 'lb-item';
                li.innerHTML = `
                    <span class="lb-rank">#${index + 1}</span>
                    <span class="lb-name">${escapeHtml(entry.name)}</span>
                    <span class="lb-score">${entry.score}</span>
                `;
                listEl.appendChild(li);
            });
        }

        // Game State
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let lives = 3;
        let elapsed = 0;       // seconds of play this round
        let speed = 0;
        let distSinceSpawn = 0;
        let invulnerable = 0;  // seconds of blinking after being hit
        let shake = 0;
        let targetX = 0;
        let time = 0;

        function updateHud() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('lives-display').innerText = '❤️'.repeat(Math.max(0, lives));
        }

        function startGame() {
            initAudio();
            clearItems();
            score = 0;
            lives = 3;
            elapsed = 0;
            distSinceSpawn = 0;
            invulnerable = 0;
            shake = 0;
            targetX = 0;
            fairy.position.x = 0;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            updateHud();

            gameState = 'PLAYING';
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            fairy.visible = true;
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('final-score').innerText = score;

            const lb = getLeaderboard();
            const lowestScore = lb.length < 5 ? 0 : lb[lb.length - 1].score;

            const hsSection = document.getElementById('new-high-score-section');
            if (score > 0 && (score > lowestScore || lb.length < 5)) {
                hsSection.classList.remove('hidden');
                document.getElementById('player-name').value = '';
            } else {
                hsSection.classList.add('hidden');
            }

            renderLeaderboard('gameover-lb');
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        function collect(item) {
            item.hit = true;
            const pos = item.mesh.position;
            if (item.type === 'star') {
                score += 1;
                playSound('star');
                burst(pos, 0xffee55);
            } else if (item.type === 'heart') {
                score += 3;
                if (lives < MAX_LIVES) lives++;
                playSound('heart');
                burst(pos, 0xff5599);
            } else if (item.type === 'cloud') {
                if (invulnerable > 0) return; // still blinking from the last bump, fly through
                lives -= 1;
                invulnerable = 1.5;
                shake = 0.45;
                playSound('hurt');
                burst(pos, 0x99aacc);
            }
            scene.remove(item.mesh);
            updateHud();
            if (lives <= 0) triggerGameOver();
        }

        // Spawning: one thing per row so there's always a way through
        function spawnRow() {
            const x = (Math.random() * 2 - 1) * (LIMIT_X - 0.2);
            const r = Math.random();
            if (r < 0.08) {
                spawnItem('heart', x, SPAWN_Z);
            } else if (r < 0.48) {
                spawnItem('cloud', x, SPAWN_Z);
            } else if (r < 0.62) {
                // A curvy trail of stars to swoop through
                const startX = THREE.MathUtils.clamp(x, -LIMIT_X + 1.2, LIMIT_X - 1.2);
                const bend = Math.random() < 0.5 ? -1 : 1;
                for (let i = 0; i < 5; i++) {
                    spawnItem('star', startX + Math.sin(i * 0.6) * 1.2 * bend, SPAWN_Z - i * 2.2);
                }
                distSinceSpawn = -9; // leave room after the trail
            } else {
                spawnItem('star', x, SPAWN_Z);
            }
        }

        // Input
        const keys = { left: false, right: false };
        let dragging = false;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key.startsWith('Arrow')) e.preventDefault();
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        });

        function steerToPointer(e) {
            const rect = canvas.getBoundingClientRect();
            const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1; // -1 at left edge, 1 at right
            targetX = THREE.MathUtils.clamp(nx * LIMIT_X * 1.4, -LIMIT_X, LIMIT_X);
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (gameState !== 'PLAYING') return;
            dragging = true;
            canvas.setPointerCapture(e.pointerId);
            steerToPointer(e);
        });
        canvas.addEventListener('pointermove', (e) => {
            if (gameState === 'PLAYING' && (dragging || e.pointerType === 'mouse')) steerToPointer(e);
        });
        canvas.addEventListener('pointerup', () => { dragging = false; });
        canvas.addEventListener('pointercancel', () => { dragging = false; });

        // Main loop
        const clock = new THREE.Clock();

        function frame() {
            const dt = Math.min(clock.getDelta(), 0.05);
            if (dt <= 0) return;
            time += dt;

            let targetSpeed = 0;
            if (gameState === 'PLAYING') targetSpeed = Math.min(MAX_SPEED, BASE_SPEED + elapsed * SPEED_GROWTH);
            else if (gameState === 'START') targetSpeed = 7;
            speed += (targetSpeed - speed) * Math.min(1, dt * 2);
            const move = speed * dt;

            // Scroll the world towards the camera
            pathTex.offset.y = (pathTex.offset.y + move / TILE_LENGTH) % 1;
            for (const orb of orbs) {
                orb.position.z += move;
                if (orb.position.z > 10) orb.position.z -= ORB_COUNT * ORB_SPACING;
            }
            const sp = sparkleGeo.attributes.position;
            for (let i = 0; i < SPARKLE_COUNT; i++) {
                sp.array[i * 3 + 2] += move * 0.8;
                if (sp.array[i * 3 + 2] > 10) sp.array[i * 3 + 2] -= PATH_LENGTH;
            }
            sp.needsUpdate = true;

            if (gameState === 'PLAYING') {
                elapsed += dt;
                distSinceSpawn += move;
                const gap = Math.max(5, 10 - elapsed * 0.05);
                if (distSinceSpawn > gap) {
                    distSinceSpawn = 0;
                    spawnRow();
                }
                const keyDir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
                targetX = THREE.MathUtils.clamp(targetX + keyDir * STEER_SPEED * dt, -LIMIT_X, LIMIT_X);
                if (invulnerable > 0) invulnerable -= dt;
            } else if (gameState === 'START') {
                targetX = Math.sin(time * 0.7) * 1.5; // gentle drift behind the menu
            }

            // Fairy movement, banking into turns
            const prevX = fairy.position.x;
            fairy.position.x += (targetX - fairy.position.x) * Math.min(1, dt * 8);
            const vx = (fairy.position.x - prevX) / dt;
            const bank = THREE.MathUtils.clamp(-vx * 0.06, -0.5, 0.5);
            fairy.rotation.z += (bank - fairy.rotation.z) * Math.min(1, dt * 8);
            fairy.position.y = FAIRY_Y + Math.sin(time * 3) * 0.08;
            for (const pivot of wings) {
                pivot.rotation.y = pivot.userData.side * (0.35 + Math.sin(time * 18) * 0.45);
            }
            fairy.visible = invulnerable > 0 && gameState === 'PLAYING' ? Math.floor(time * 12) % 2 === 0 : true;

            // Items
            for (let i = items.length - 1; i >= 0; i--) {
                const it = items[i];
                const p = it.mesh.position;
                p.z += move;
                if (it.type === 'cloud') {
                    p.y = FAIRY_Y + 0.25 + Math.sin(time * 2 + it.phase) * 0.12;
                } else {
                    it.mesh.rotation.y += dt * 2.5;
                }

                // Did it pass through the fairy this frame?
                if (gameState === 'PLAYING' && !it.hit && p.z > -0.6 && p.z - move < 0.6
                    && Math.abs(p.x - fairy.position.x) < HIT_RADIUS[it.type]) {
                    collect(it);
                    if (it.hit && !it.mesh.parent) {
                        items.splice(i, 1);
                        continue;
                    }
                }

                if (p.z > DESPAWN_Z) {
                    scene.remove(it.mesh);
                    items.splice(i, 1);
                }
            }

            updateBursts(dt, move);

            // Camera follows the fairy loosely
            camera.position.x += (fairy.position.x * 0.5 - camera.position.x) * Math.min(1, dt * 4);
            camera.position.y = camY;
            camera.position.z = camZ;
            if (shake > 0) {
                shake -= dt;
                camera.position.x += (Math.random() - 0.5) * shake;
                camera.position.y += (Math.random() - 0.5) * shake;
            }
            camera.lookAt(fairy.position.x * 0.7, FAIRY_Y, -6);

            renderer.render(scene, camera);
        }

        // UI buttons
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        document.getElementById('save-score-btn').addEventListener('click', () => {
            const nameInput = document.getElementById('player-name');
            const name = nameInput.value.trim() || 'Fairy Player';

            let lb = getLeaderboard();
            lb.push({ name, score });
            lb.sort((a, b) => b.score - a.score);
            lb = lb.slice(0, 5);

            saveLeaderboard(lb);
            document.getElementById('new-high-score-section').classList.add('hidden');
            renderLeaderboard('gameover-lb');
            renderLeaderboard('start-lb');
        });

        renderLeaderboard('start-lb');
        renderer.setAnimationLoop(frame);
    </script>
</body>
</html>
